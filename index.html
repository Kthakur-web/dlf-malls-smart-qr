
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLF MALLS App</title>
</head>
<body>
  <h2>Redirecting to DLF MALLS...</h2>
  <p>Please wait...</p>

  <script>
    const androidURL =
      "https://play.google.com/store/apps/details?id=com.dlfmall.app";

    const appleURL =
      "https://apps.apple.com/in/app/dlf-malls/id6821989496";

    const ua = navigator.userAgent || "";

    if (/android/i.test(ua)) {
      window.location.replace(androidURL);
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      window.location.replace(appleURL);
    } else {
      document.body.innerHTML = `
        <h2>Download DLF MALLS</h2>
        <a href="${androidURL}">Android - Google Play Store</a>
        <br><br>
        <a href="${appleURL}">iPhone - Apple App Store</a>
      `;
    }
  </script>
</body>
</html>
